<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="sleep-aur — A minimalist, auditable AUR helper for Arch Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#accent)"/>

  <g font-family="'JetBrains Mono','Fira Code',monospace">
    <text x="80" y="208" fill="#e6edf3" font-size="82" font-weight="700">sleep-aur</text>
    <rect x="80" y="232" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="290" fill="#8b949e" font-size="27">A minimalist, auditable AUR helper</text>
    <text x="80" y="326" fill="#8b949e" font-size="27">for Arch Linux.</text>

    <text x="80" y="404" fill="#c9d1d9" font-size="20"><tspan fill="#3fb950">✓</tspan> Pure Bash, no eval</text>
    <text x="80" y="442" fill="#c9d1d9" font-size="20"><tspan fill="#3fb950">✓</tspan> Recursive AUR dependencies</text>
    <text x="80" y="480" fill="#c9d1d9" font-size="20"><tspan fill="#3fb950">✓</tspan> SHA-256 verified installs</text>

    <text x="80" y="576" fill="#58a6ff" font-size="18">github.com/the-sleepless/sleep-aur</text>
  </g>

  <g>
    <rect x="650" y="128" width="550" height="384" rx="14" fill="#010409" stroke="#30363d" stroke-width="1"/>
    <circle cx="678" cy="152" r="6" fill="#ff5f56"/>
    <circle cx="700" cy="152" r="6" fill="#ffbd2e"/>
    <circle cx="722" cy="152" r="6" fill="#27c93f"/>
    <line x1="650" y1="174" x2="1200" y2="174" stroke="#21262d" stroke-width="1"/>

    <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="16">
      <text x="680" y="216" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> sleep-aur install -y brave-bin</text>
      <text x="680" y="256" fill="#58a6ff">==&gt; Resolving dependencies...</text>
      <text x="680" y="286" fill="#58a6ff">==&gt; Downloading PKGBUILD...</text>
      <text x="680" y="316" fill="#58a6ff">==&gt; Building brave-bin...</text>
      <text x="680" y="346" fill="#58a6ff">==&gt; Installing package...</text>
      <text x="680" y="386" fill="#3fb950">[ok] brave-bin installed.</text>
      <text x="680" y="438" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> sleep-aur update --all</text>
      <text x="680" y="478" fill="#3fb950">==&gt; All managed packages are up to date.</text>
    </g>
  </g>
</svg>
